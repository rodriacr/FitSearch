# Nginx del contenedor frontend (FS-HU-11): sirve el build de Vite y reenvía /api al contenedor backend.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los documentos de verificación pesan hasta 5 MB (FS-HU-12).
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El asistente IA puede tardar en responder.
        proxy_read_timeout 90s;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché por mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de React Router: cualquier otra ruta entrega index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
